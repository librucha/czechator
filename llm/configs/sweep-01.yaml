dataset: data/sets/s01
# Qwen3.5-0.8B and -2B passed the export gate but were dropped: mlx-lm 0.32
# trains their gated delta layers through a Python per-token loop
# (models/qwen3_5.py: use_kernel=not self.training), ~26 trained tok/s on 0.8B.
candidates:
  - name: gemma4-e2b
    hf: google/gemma-4-E2B-it
    ollama_base: gemma4:e2b
    lr: 1.0e-4
  - name: gemma3-270m
    hf: google/gemma-3-270m-it
    ollama_base: gemma3:270m
    lr: 2.0e-4
train:
  rank: 16
  alpha: 32
  batch_size: 16
  epochs: 1
  max_seq_length: 2560
  steps_per_eval: 200
  save_every: 200
  seed: 0
