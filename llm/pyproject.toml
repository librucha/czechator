[project]
name = "czllm"
version = "0.1.0"
description = "Fine-tuning a small model for Czech diacritics restoration"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets>=5",
    "pyyaml>=6.0",
]

[project.scripts]
czllm = "czllm.cli:main"

[dependency-groups]
dev = ["pytest>=9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs external tools (hunspell, ollama)"]
